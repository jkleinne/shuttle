name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RCLONE_VERSION: "1.74.4"
  RCLONE_LINUX_AMD64_SHA256: "fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install sync tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl rsync unzip
          archive="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            --output "${archive_path}" \
            "https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}/${archive}"
          echo "${RCLONE_LINUX_AMD64_SHA256}  ${archive_path}" | sha256sum --check -
          unzip -q "${archive_path}" -d "${RUNNER_TEMP}/rclone"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/rclone/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" \
            /usr/local/bin/rclone

      - name: Verify sync tools
        run: |
          command -v rsync
          command -v rclone
          rsync --version
          rclone version

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed so --new-from-merge-base can resolve origin/main.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          # Only flag issues introduced by the current branch. Existing
          # violations are treated as baselined debt.
          args: --new-from-merge-base=origin/main

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.2.0

      - name: Run govulncheck
        run: govulncheck ./...
